name: Android 7 build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;28.1.13356709" "cmake;3.31.6" "platform-tools"

      - name: Install conan
        run: pip install conan numpy

      - name: Cache conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-api24-v1
          restore-keys: conan-api24-

      - name: Detect conan profile
        run: conan profile detect -f

      - name: Disable clang-tidy (style linter, not needed)
        run: |
          mkdir -p "$HOME/fakebin"
          printf '#!/bin/sh\nexit 0\n' > "$HOME/fakebin/clang-tidy"
          chmod +x "$HOME/fakebin/clang-tidy"
          for v in 17 18 19 20 21 22; do
           cp "$HOME/fakebin/clang-tidy" "$HOME/fakebin/clang-tidy-$v"
          done
          echo "$HOME/fakebin" >> "$GITHUB_PATH"

      - name: Build FOSS debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleFossDebug

      - name: Lint
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintFossDebug

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fptn-android7-apks
          path: app/build/outputs/apk/foss/debug/*.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-fossDebug.*
